<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusSeat - Search Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      border: none;
    }
  </style>
</head>
<body>

<div class="container p-3">
  <div class="card shadow-lg p-4 search-card mx-auto">
    
    <!-- Branding Header -->
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary mb-1">CampusSeat</h3>
      <p class="text-muted small mb-0">Exam Seating Intimation</p>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="text-center my-3">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="small text-muted mt-2">Fetching seating plan...</p>
    </div>

    <!-- Unreleased Alert -->
    <div id="unreleasedAlert" class="alert alert-warning text-center d-none mb-0">
      <h5 class="alert-heading fw-bold mb-1">Seating Not Released</h5>
      <p class="small mb-0">Seating for today's session has not been published yet. Please scan again later.</p>
    </div>

    <!-- Student Search Form -->
    <div id="searchForm" class="d-none">
      <div class="mb-3">
        <label for="regInput" class="form-label fw-semibold">Register Number</label>
        <input type="text" id="regInput" class="form-control form-control-lg text-center fw-bold" placeholder="Enter Reg No" autofocus>
      </div>
      <button onclick="searchSeating()" class="btn btn-primary btn-lg w-100 fw-semibold">Search Seat</button>

      <!-- Result Card Container -->
      <div id="resultContainer" class="mt-4"></div>
    </div>

  </div>
</div>

<script>
  // Paste your Google Apps Script Web App URL here
  const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 
  let seatingData = [];

  window.onload = function() {
    fetch(API_URL)
      .then(res => res.json())
      .then(resData => {
        document.getElementById('loading').classList.add('d-none');
        if (resData.isReleased) {
          seatingData = resData.data || [];
          document.getElementById('searchForm').classList.remove('d-none');
        } else {
          document.getElementById('unreleasedAlert').classList.remove('d-none');
        }
      })
      .catch(() => {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('unreleasedAlert').classList.remove('d-none');
      });
  };

  function searchSeating() {
    const regNo = document.getElementById('regInput').value.trim();
    const resultContainer = document.getElementById('resultContainer');
    resultContainer.innerHTML = '';

    if (!regNo) return;

    const matches = seatingData.filter(item => String(item.reg_no).trim() === regNo);

    if (matches.length > 0) {
      let html = '';
      matches.forEach(item => {
        html += `
          <div class="alert alert-success text-start border-0 shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-primary fs-6">${item.session} Session</span>
              <span class="fw-bold fs-5 text-dark">Room: ${item.room}</span>
            </div>
            <hr class="my-2">
            <div class="fs-6"><strong>Seat Number:</strong> <span class="badge bg-dark fs-6">${item.seat}</span></div>
            ${item.date ? `<small class="text-muted d-block mt-1">Date: ${item.date}</small>` : ''}
          </div>
        `;
      });
      resultContainer.innerHTML = html;
    } else {
      resultContainer.innerHTML = `
        <div class="alert alert-danger text-center">
          No seating assignment found for Register No: <strong>${regNo}</strong>.
        </div>
      `;
    }
  }

  // Allow pressing "Enter" on mobile keyboard to search
  document.getElementById('regInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      searchSeating();
    }
  });
</script>

</body>
</html>
