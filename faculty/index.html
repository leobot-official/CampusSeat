<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Admin - ExamSeat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <h3 class="mb-3">Publish Seating Arrangement</h3>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Google Sheet URL</label>
          <input type="url" id="sheetUrl" class="form-control" placeholder="https://docs.google.com/spreadsheets/d/..." required>
        </div>

        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" id="releaseToggle" checked>
          <label class="form-check-label fw-bold" for="releaseToggle">Release to Students Immediately</label>
        </div>

        <button onclick="submitSeating()" id="submitBtn" class="btn btn-primary w-100 btn-lg">Publish Seating Plan</button>
        <div id="statusMsg" class="mt-3 text-center"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; // Paste your deployed Web App URL here

  function submitSeating() {
    const sheetUrl = document.getElementById('sheetUrl').value.trim();
    const isReleased = document.getElementById('releaseToggle').checked;
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    if (!sheetUrl) {
      alert("Please paste the Google Sheet URL!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Processing & Converting...";
    statusMsg.innerHTML = '<span class="text-info">Parsing Google Sheet & updating Drive...</span>';

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ sheetUrl: sheetUrl, isReleased: isReleased })
    })
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = "Publish Seating Plan";
      if (data.status === "success") {
        statusMsg.innerHTML = `<span class="text-success fw-bold">Successfully Published! Updated ${data.count} student seating records.</span>`;
      } else {
        statusMsg.innerHTML = `<span class="text-danger">Error: ${data.message}</span>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "Publish Seating Plan";
      statusMsg.innerHTML = `<span class="text-danger">Failed to publish. Check permissions or URL.</span>`;
    });
  }
</script>

</body>
</html>
