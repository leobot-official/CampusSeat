<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Admin - Exam Seating Publisher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS Library for Excel Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm p-4">
        <h3 class="mb-3">Faculty Exam Seating Converter</h3>
        <p class="text-muted">Upload daily Excel format sheet to generate the update code for <code>data.js</code>.</p>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Select Daily Seating Excel File</label>
          <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls">
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="releaseToggle" checked>
          <label class="form-check-label fw-bold" for="releaseToggle">Release to Students Immediately</label>
        </div>

        <button onclick="processExcel()" class="btn btn-primary w-100 btn-lg">Convert & Generate Code</button>

        <div id="outputSection" class="mt-4 d-none">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Generated JavaScript Output</h5>
            <button onclick="copyToClipboard()" class="btn btn-sm btn-outline-secondary">Copy Code</button>
          </div>
          <textarea id="jsOutput" class="form-control font-monospace" rows="10" readonly></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function processExcel() {
  const fileInput = document.getElementById('excelFile');
  if (!fileInput.files.length) {
    alert("Please select an Excel file first!");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const parsedRecords = [];

    workbook.SheetNames.forEach(sheetName => {
      if (sheetName.toLowerCase().includes('sheet')) return;
      
      const sheet = workbook.Sheets[sheetName];
      const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      let room = sheetName.trim();
      let date = "";
      let session = "FN/AN";

      // Parse metadata from header rows
      jsonData.slice(0, 5).forEach(row => {
        const rowStr = row.join(" ");
        if (rowStr.includes("DATE")) {
          const dateMatch = rowStr.match(/DATE\s*:\s*([0-9\.]+)/i);
          if (dateMatch) date = dateMatch[1];
        }
        if (rowStr.includes("SESSION")) {
          const sessMatch = rowStr.match(/SESSION\s*:\s*([A-Z]+)/i);
          if (sessMatch) session = sessMatch[1];
        }
      });

      // Parse grid seat assignments
      for (let r = 5; r < jsonData.length; r++) {
        const row = jsonData[r];
        if (!row) continue;
        for (let c = 0; c < row.length - 1; c++) {
          const seat = String(row[c] || '').trim();
          const regNo = String(row[c+1] || '').trim();

          if (/^[A-Z][0-9]+$/.test(seat) && /^[0-9]+$/.test(regNo)) {
            parsedRecords.push({ reg_no: regNo, session: session, date: date, room: room, seat: seat });
          }
        }
      }
    });

    const isReleased = document.getElementById('releaseToggle').checked;
    const outputCode = `const seatingConfig = {\n  isReleased: ${isReleased},\n  recordCount: ${parsedRecords.length}\n};\n\nconst seatingData = ${JSON.stringify(parsedRecords, null, 2)};`;

    document.getElementById('jsOutput').value = outputCode;
    document.getElementById('outputSection').classList.remove('d-none');
  };

  reader.readAsArrayBuffer(file);
}

function copyToClipboard() {
  const text = document.getElementById('jsOutput');
  text.select();
  document.execCommand('copy');
  alert('Code copied to clipboard! Paste this into student/data.js and commit to GitHub.');
}
</script>

</body>
</html>
